<!doctype html>
<!-- LiteSwitch without Next.js: one HTML page + liteswitch.js, no build step.
     Serve this folder with any static server, e.g.  npx serve examples/plain-html  -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiteSwitch plain HTML example</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 680px; margin: 0 auto; padding: 24px 16px; line-height: 1.6; }
      .media { aspect-ratio: 16 / 9; background: #f1f5f9; border-radius: 8px; overflow: hidden; }
      .media video, .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .media button { width: 100%; height: 100%; border: 0; cursor: pointer; background: none; padding: 0; }
      .status { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #64748b; }
    </style>
  </head>
  <body>
    <h1>My article</h1>
    <p>All the text is in the HTML, so it shows on every connection. Only the heavy media depends on LiteSwitch.</p>

    <!-- Empty until we know the variant, so no heavy bytes load before the decision. -->
    <div class="media" id="media" aria-busy="true"></div>

    <p><button id="start" disabled>Loading…</button></p>
    <p class="status" id="status">deciding…</p>

    <script type="module">
      import { decide } from "./liteswitch.js";

      // 1. Paste your Flagsmith CLIENT-SIDE environment key (public by design).
      //    Until you do, everyone gets the full page and nothing is tracked.
      const ENVIRONMENT_KEY = "YOUR_CLIENT_SIDE_ENVIRONMENT_KEY";

      // 2. Your own heavy and light media. These point at the LiteSwitch demo files.
      const FULL_VIDEO = "https://liteswitch.vercel.app/media/git-intro-1080p.mp4"; // ~6 MB
      const LITE_POSTER = "https://liteswitch.vercel.app/media/git-intro-poster.jpg"; // ~8 KB
      const LITE_VIDEO = "https://liteswitch.vercel.app/media/git-intro-360p.mp4"; // ~0.24 MB, only on tap

      const choice = await decide({ environmentID: ENVIRONMENT_KEY });
      const media = document.getElementById("media");
      const start = document.getElementById("start");

      // 3. Render the chosen variant.
      if (choice.config.video === "autoplay-hd") {
        // controls: moving content must be pausable (keyboard users included).
        media.innerHTML = `<video src="${FULL_VIDEO}" autoplay muted loop playsinline controls></video>`;
      } else {
        // Lite: a tiny poster; the small video downloads only if the visitor asks for it.
        media.innerHTML = `<button aria-label="Play video (360p, 0.24 MB)"><img src="${LITE_POSTER}" alt="Video preview: tap to play"></button>`;
        media.querySelector("button").addEventListener("click", () => {
          media.innerHTML = `<video src="${LITE_VIDEO}" controls autoplay playsinline></video>`;
        }, { once: true });
      }
      media.removeAttribute("aria-busy");

      // 4. Record the exposure as soon as the variant is on the page (not when it
      //    finishes loading), so visitors who give up during a heavy load still count.
      choice.recordExposure();

      // 5. Your conversion event. Same visitor id as the flag decision, automatically.
      start.disabled = false;
      start.textContent = "Start reading";
      start.addEventListener("click", () => {
        choice.track("lesson_started");
        start.disabled = true;
        start.textContent = "Started ✓";
      }, { once: true });

      document.getElementById("status").textContent =
        `page: ${choice.config.video === "autoplay-hd" ? "full" : "lite"} · reason: ${choice.reason} · in experiment: ${choice.enrolled ? "yes" : "no"}`;
    </script>
  </body>
</html>
