<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700">
  <rect width="1600" height="700" fill="#ffffff"/>
  <text x="80" y="90" font-family="Arial" font-size="48" font-weight="bold" fill="#0f172a">commit → branch → merge</text>
  <!-- main line -->
  <line x1="160" y1="360" x2="1440" y2="360" stroke="#334155" stroke-width="8"/>
  <!-- feature branch -->
  <path d="M520 360 C 600 200, 700 200, 780 200 L 1000 200 C 1080 200, 1160 360, 1240 360" fill="none" stroke="#16a34a" stroke-width="8"/>
  <g font-family="Arial" font-size="30" fill="#0f172a">
    <circle cx="200" cy="360" r="36" fill="#2563eb"/><text x="160" y="440">first</text>
    <circle cx="520" cy="360" r="36" fill="#2563eb"/><text x="470" y="440">add page</text>
    <circle cx="800" cy="200" r="36" fill="#16a34a"/><text x="740" y="140">try idea</text>
    <circle cx="1000" cy="200" r="36" fill="#16a34a"/><text x="950" y="140">polish</text>
    <circle cx="900" cy="360" r="36" fill="#2563eb"/><text x="850" y="440">fix typo</text>
    <circle cx="1240" cy="360" r="44" fill="#9333ea"/><text x="1190" y="450">merge</text>
  </g>
  <g font-family="Arial" font-size="34" fill="#475569">
    <text x="80" y="600">main</text><text x="80" y="200" fill="#16a34a">idea</text>
  </g>
</svg>
